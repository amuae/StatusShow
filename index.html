<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Next-generation server monitoring and management tools" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>NodeGet - StatusShow</title>
    <!-- 水墨风字体：霞鹜文楷 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai:wght@300;400;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('nodeget.theme')
        if (t !== 'light') {
          document.documentElement.classList.add('dark')
        }
      } catch (_) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 访客胶囊 — 页面完全加载后异步注入，零阻塞
      window.addEventListener('load', function () {
        setTimeout(function () {
          var link = document.createElement('link')
          link.rel = 'stylesheet'
          link.href = './custom.css?v=6'
          document.head.appendChild(link)
          var script = document.createElement('script')
          script.src = './custom.js?v=6'
          document.body.appendChild(script)
        }, 300)
      })
    </script>
  </body>
</html>
